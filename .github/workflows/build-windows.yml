name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

      - name: Build onefile exe
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/build_exe.ps1

      - name: Verify exe
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/VenvManager.exe")) {
            throw "dist/VenvManager.exe was not created."
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VenvManager-windows-onefile
          path: dist/VenvManager.exe
